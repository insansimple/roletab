<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>RoleTab - Task Monitor</title>
  <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
  <style>
    :root,
    :root[data-theme="dark"] {
      --panel-bg: #202124;
      --surface-bg: #292a2d;
      --input-bg: #202124;
      --border-subtle: #3c4043;
      --text-main: #e8eaed;
      --text-muted: #9aa0a6;
      --btn-hover: rgba(255, 255, 255, 0.1);
      --accent-focus: #8ab4f8;
      --primary-btn: #1a73e8;
      --ok-text: #81c995;
      --warn-text: #fbbf24;
      --danger-text: #f28b82;
    }
    :root[data-theme="light"] {
      --panel-bg: #f1f3f4;
      --surface-bg: #ffffff;
      --input-bg: #f1f3f4;
      --border-subtle: #dadce0;
      --text-main: #202124;
      --text-muted: #5f6368;
      --btn-hover: rgba(32, 33, 36, 0.08);
      --accent-focus: #1a73e8;
      --primary-btn: #1a73e8;
      --ok-text: #137333;
      --warn-text: #92400e;
      --danger-text: #c5221f;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--panel-bg);
      color: var(--text-main);
    }
    .side-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-left: 2px solid var(--border-subtle);
    }
    .side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background: var(--surface-bg);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .side-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .side-title i { color: var(--accent-focus); }
    .side-header-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }
    .icon-btn:hover { background: var(--btn-hover); }
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent-focus);
      outline-offset: 1px;
    }
    .accent-swatch-row {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .accent-dot-btn {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 9px;
      background: var(--surface-bg);
    }
    .accent-dot-btn.selected {
      border-color: var(--text-main);
    }

    .btn {
      height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-ghost {
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--text-main);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--btn-hover); }
    .btn-ghost:disabled { opacity: 0.45; cursor: default; }
    .btn-ghost.active-pin {
      border-color: var(--accent-focus);
      color: var(--accent-focus);
    }

    .settings-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
    }
    .settings-select {
      height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-bg);
      color: var(--text-main);
      font-size: 11.5px;
      cursor: pointer;
    }
    .summary-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .summary-ram {
      color: var(--text-main);
      font-weight: 600;
    }

    .side-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mon-card {
      background: var(--surface-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mon-top {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .mon-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      color: #ffffff;
      flex-shrink: 0;
    }
    .mon-title {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mon-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .mon-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .status-tag {
      font-weight: 600;
    }
    .status-tag.sleep { color: var(--accent-focus); }
    .status-tag.audio { color: var(--ok-text); }
    .status-tag.pinned { color: var(--warn-text); }
    .status-tag.crash { color: var(--danger-text); }
  </style>
</head>
<body>
  <div class="side-shell">
    <header class="side-header">
      <h1 class="side-title">
        <i class="fa-solid fa-microchip" aria-hidden="true"></i>
        <span id="monPanelTitle">Task Monitor</span>
      </h1>
      <div class="side-header-actions">
        <button type="button" class="icon-btn" id="refreshMonBtn">
          <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
        </button>
        <button type="button" class="icon-btn" id="closeMonPanelBtn">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <div class="settings-bar">
      <div class="settings-row">
        <label for="idleSleepSelect" id="idleSleepLabel">Auto-Sleep Idle</label>
        <select class="settings-select" id="idleSleepSelect">
          <option value="5">5 menit</option>
          <option value="15">15 menit</option>
          <option value="30">30 menit</option>
          <option value="0">Nonaktif</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="uiDensitySelect" id="uiDensityLabel">Kepadatan UI</label>
        <select class="settings-select" id="uiDensitySelect">
          <option value="comfortable">Nyaman</option>
          <option value="compact">Rapat</option>
        </select>
      </div>
      <div class="settings-row">
        <span id="accentThemeLabel">Warna Aksen</span>
        <div class="accent-swatch-row" id="accentSwatchRow" role="group" aria-label="Warna Aksen"></div>
      </div>
      <div class="summary-strip">
        <span class="summary-ram" id="monTotalRamText" aria-live="polite">0 MB</span>
        <button type="button" class="btn btn-ghost" id="sleepIdleBtn">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
          <span id="sleepIdleLabel">Sleep Idle</span>
        </button>
      </div>
    </div>

    <main class="side-body" id="monitorList"></main>
  </div>

  <script src="./i18n.js"></script>
  <script src="./task-monitor.js"></script>
</body>
</html>
