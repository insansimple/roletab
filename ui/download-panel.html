<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>RoleTab - Downloads</title>
  <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
  <style>
    :root,
    :root[data-theme="dark"] {
      --panel-bg: #202124;
      --surface-bg: #292a2d;
      --border-subtle: #3c4043;
      --text-main: #e8eaed;
      --text-muted: #9aa0a6;
      --btn-hover: rgba(255, 255, 255, 0.1);
      --accent-focus: #8ab4f8;
      --primary-btn: #1a73e8;
      --ok-text: #81c995;
      --danger-text: #f28b82;
    }
    :root[data-theme="light"] {
      --panel-bg: #f1f3f4;
      --surface-bg: #ffffff;
      --border-subtle: #dadce0;
      --text-main: #202124;
      --text-muted: #5f6368;
      --btn-hover: rgba(32, 33, 36, 0.08);
      --accent-focus: #1a73e8;
      --primary-btn: #1a73e8;
      --ok-text: #137333;
      --danger-text: #c5221f;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--panel-bg);
      color: var(--text-main);
    }
    .side-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-left: 2px solid var(--border-subtle);
    }
    .side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background: var(--surface-bg);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .side-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .side-title i { color: var(--accent-focus); }
    .side-header-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }
    .icon-btn:hover { background: var(--btn-hover); }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent-focus);
      outline-offset: 1px;
    }

    .btn {
      height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-ghost {
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--text-main);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--btn-hover); }
    .btn-ghost:disabled { opacity: 0.45; cursor: default; }

    .subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--panel-bg);
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .group-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-main);
      font-weight: 500;
    }
    .group-toggle input {
      accent-color: var(--primary-btn);
      cursor: pointer;
    }

    .side-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dl-card {
      background: var(--surface-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dl-top {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .dl-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      color: #ffffff;
      flex-shrink: 0;
    }
    .dl-name {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: text;
    }
    .dl-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .dl-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }
    .dl-status.inProgress { color: var(--accent-focus); }
    .dl-status.completed { color: var(--ok-text); }
    .dl-status.failed { color: var(--danger-text); }
    .dl-path {
      font-size: 10.5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: text;
    }

    .empty-state {
      margin-top: 24px;
      padding: 24px 16px;
      text-align: center;
      background: var(--surface-bg);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .empty-state i {
      font-size: 22px;
      color: var(--text-muted);
    }
    .empty-state h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
    }
    .empty-state p {
      margin: 0;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .empty-state[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="side-shell">
    <header class="side-header">
      <h1 class="side-title">
        <i class="fa-solid fa-download" aria-hidden="true"></i>
        <span id="dlPanelTitle">Unduhan</span>
      </h1>
      <div class="side-header-actions">
        <button type="button" class="btn btn-ghost" id="clearDownloadsBtn">
          <i class="fa-solid fa-trash" aria-hidden="true"></i>
          <span id="clearDownloadsLabel">Hapus Daftar</span>
        </button>
        <button type="button" class="icon-btn" id="closeDlPanelBtn">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <div class="subbar">
      <label class="group-toggle">
        <input type="checkbox" id="groupByProfileToggle" checked />
        <span id="groupByProfileLabel">Grup per Profil</span>
      </label>
      <span id="dlCountText" aria-live="polite">0 item</span>
    </div>

    <main class="side-body">
      <div class="empty-state" id="dlEmptyState" hidden>
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
        <h2 id="dlEmptyTitle">Belum ada unduhan</h2>
        <p id="dlEmptyDesc">File yang diunduh dari tab akan muncul di sini dan dikelompokkan sesuai profil.</p>
      </div>
      <div id="downloadsList"></div>
    </main>
  </div>

  <script src="./i18n.js"></script>
  <script src="./download-panel.js"></script>
</body>
</html>
